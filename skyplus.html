<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>sky+ | そらのほし学習塾</title>
<link rel="manifest" href="data:application/manifest+json,{%22name%22:%22sky%2B%22,%22short_name%22:%22sky%2B%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%23F4FAFF%22,%22theme_color%22:%22%232979FF%22}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-bg:#F3FAFF;
    --sky-card:#FFFFFF;
    --sky-100:#E4F3FF;
    --sky-200:#CDEBFF;
    --blue-600:#2979FF;
    --blue-700:#1B5FE0;
    --blue-900:#123A8C;
    --yellow-400:#FFCC33;
    --yellow-500:#F5B301;
    --ink-900:#1B2733;
    --ink-600:#4B5A68;
    --ink-400:#8496A6;
    --line:#DDEBF6;
    --danger:#FF6B6B;
    --ok:#33B679;
    --radius-lg:22px;
    --radius-md:16px;
    --radius-sm:10px;
    --shadow:0 6px 18px rgba(27,95,224,0.08);
    --header-h:64px;
    --nav-h:68px;
    color-scheme: light;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --sky-bg:#0E1620;
      --sky-card:#16212D;
      --sky-100:#17263A;
      --sky-200:#1D3350;
      --blue-600:#5B9BFF;
      --blue-700:#4A87F2;
      --blue-900:#DCEBFF;
      --yellow-400:#FFCC33;
      --yellow-500:#F5B301;
      --ink-900:#EAF2FA;
      --ink-600:#B7C6D6;
      --ink-400:#7E90A2;
      --line:#233247;
      --shadow:0 6px 18px rgba(0,0,0,0.35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --sky-bg:#0E1620;
    --sky-card:#16212D;
    --sky-100:#17263A;
    --sky-200:#1D3350;
    --blue-600:#5B9BFF;
    --blue-700:#4A87F2;
    --blue-900:#DCEBFF;
    --ink-900:#EAF2FA;
    --ink-600:#B7C6D6;
    --ink-400:#7E90A2;
    --line:#233247;
    --shadow:0 6px 18px rgba(0,0,0,0.35);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--sky-bg);
    color:var(--ink-900);
    font-family:'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  button{font-family:inherit;}
  a{color:inherit;}
  #app{min-height:100vh;}
  .hidden{display:none !important;}
  img{max-width:100%;}

  /* ---------- Logo ---------- */
  .logo{display:flex;align-items:center;gap:8px;user-select:none;}
  .logo svg{display:block;}
  .logo-text{font-weight:800;font-size:22px;letter-spacing:0.5px;color:var(--blue-700);}
  .logo-text .plus{color:var(--yellow-500);}

  /* ---------- Login screen ---------- */
  .login-wrap{
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 20px 48px;
    background:
      radial-gradient(circle at 15% 10%, var(--sky-200) 0%, transparent 45%),
      radial-gradient(circle at 85% 85%, var(--sky-100) 0%, transparent 50%),
      var(--sky-bg);
    text-align:center;
  }
  .login-logo{margin-bottom:8px;}
  .login-sub{color:var(--ink-600);font-size:14px;margin:4px 0 36px;}
  .login-card{
    background:var(--sky-card);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
    padding:22px;
    width:100%;max-width:380px;
  }
  .login-title{font-weight:700;font-size:15px;color:var(--ink-600);margin:0 0 14px;text-align:left;}
  .role-btn{
    width:100%;
    display:flex;align-items:center;gap:14px;
    background:var(--sky-100);
    border:2px solid transparent;
    border-radius:var(--radius-md);
    padding:14px 16px;
    margin-bottom:12px;
    cursor:pointer;
    text-align:left;
    transition:transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .role-btn:hover{border-color:var(--blue-600);background:var(--sky-200);}
  .role-btn:active{transform:scale(0.98);}
  .role-emoji{font-size:26px;width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:var(--sky-card);border-radius:50%;flex-shrink:0;}
  .role-name{font-weight:700;font-size:15px;}
  .role-desc{font-size:12.5px;color:var(--ink-600);margin-top:2px;}
  .login-note{font-size:11.5px;color:var(--ink-400);margin-top:18px;line-height:1.7;}

  /* ---------- App shell ---------- */
  .shell{padding-bottom:calc(var(--nav-h) + 18px);min-height:100vh;}
  .topbar{
    position:sticky;top:0;z-index:30;
    display:flex;align-items:center;justify-content:space-between;
    height:var(--header-h);
    padding:0 16px;
    background:var(--sky-card);
    border-bottom:1px solid var(--line);
  }
  .topbar-left{display:flex;align-items:center;gap:10px;min-width:0;}
  .topbar-title{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar-role{font-size:11px;color:var(--ink-600);background:var(--sky-100);padding:2px 8px;border-radius:20px;flex-shrink:0;}
  .topbar-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .icon-btn{
    position:relative;width:40px;height:40px;border-radius:50%;border:none;
    background:var(--sky-100);display:flex;align-items:center;justify-content:center;
    font-size:18px;cursor:pointer;
  }
  .icon-btn:hover{background:var(--sky-200);}
  .badge-dot{
    position:absolute;top:4px;right:5px;width:9px;height:9px;border-radius:50%;
    background:var(--danger);border:2px solid var(--sky-card);
  }

  .dropdown{
    position:absolute;top:calc(var(--header-h) - 4px);right:12px;width:300px;max-width:88vw;
    background:var(--sky-card);border-radius:var(--radius-md);box-shadow:var(--shadow);
    border:1px solid var(--line);z-index:40;max-height:70vh;overflow:auto;
  }
  .dropdown-head{padding:12px 14px;font-weight:700;font-size:13px;border-bottom:1px solid var(--line);color:var(--ink-600);}
  .dropdown-item{padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer;}
  .dropdown-item:last-child{border-bottom:none;}
  .dropdown-item:hover{background:var(--sky-100);}
  .dropdown-item .t{font-weight:700;margin-bottom:2px;}
  .dropdown-item .d{color:var(--ink-600);font-size:12px;}
  .dropdown-empty{padding:24px 14px;text-align:center;color:var(--ink-400);font-size:13px;}

  .main{max-width:900px;margin:0 auto;padding:18px 16px 8px;}
  .greeting{font-size:19px;font-weight:800;margin:2px 0 4px;}
  .greeting-sub{font-size:13px;color:var(--ink-600);margin:0 0 18px;}

  .section-title{font-size:14.5px;font-weight:800;margin:22px 0 10px;display:flex;align-items:center;gap:6px;}
  .section-title:first-child{margin-top:0;}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (min-width:640px){.grid{grid-template-columns:1fr 1fr;}}

  .card{
    background:var(--sky-card);
    border-radius:var(--radius-lg);
    padding:16px;
    box-shadow:var(--shadow);
    border:1px solid var(--line);
  }
  .card-wide{grid-column:1 / -1;}
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .card-label{font-size:12px;color:var(--ink-600);font-weight:700;display:flex;align-items:center;gap:6px;}
  .card-emoji{font-size:20px;}
  .card-main{font-size:15px;font-weight:700;line-height:1.5;}
  .card-meta{font-size:12px;color:var(--ink-600);margin-top:4px;}
  .card-empty{font-size:13px;color:var(--ink-400);padding:6px 0;}
  .arrow{color:var(--ink-400);font-size:13px;}

  .list-row{
    display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
    padding:13px 0;border-bottom:1px solid var(--line);
  }
  .list-row:last-child{border-bottom:none;}
  .lr-main{min-width:0;}
  .lr-title{font-weight:700;font-size:14.5px;}
  .lr-sub{font-size:12.5px;color:var(--ink-600);margin-top:3px;line-height:1.6;}
  .lr-right{flex-shrink:0;text-align:right;}

  .badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;}
  .badge-blue{background:var(--sky-100);color:var(--blue-700);}
  .badge-yellow{background:#FFF3CF;color:#8A6100;}
  .badge-red{background:#FFE1E1;color:#C62828;}
  .badge-green{background:#DFF6E9;color:#1E8A55;}
  .badge-gray{background:var(--sky-100);color:var(--ink-600);}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:none;border-radius:var(--radius-sm);
    padding:12px 18px;font-weight:700;font-size:14px;cursor:pointer;
    transition:transform .1s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--blue-600);color:#fff;}
  .btn-primary:hover{background:var(--blue-700);}
  .btn-yellow{background:var(--yellow-400);color:#4A3600;}
  .btn-outline{background:transparent;border:2px solid var(--line);color:var(--ink-900);}
  .btn-outline:hover{border-color:var(--blue-600);}
  .btn-sm{padding:8px 13px;font-size:12.5px;border-radius:9px;}
  .btn-block{width:100%;}
  .btn-danger{background:#FFE1E1;color:#C62828;}
  .btn[disabled]{opacity:0.5;cursor:not-allowed;}

  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex-shrink:0;padding:9px 15px;border-radius:20px;font-size:13px;font-weight:700;
    background:var(--sky-100);color:var(--ink-600);cursor:pointer;border:none;white-space:nowrap;
  }
  .tab.active{background:var(--blue-600);color:#fff;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-600);margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%;border:2px solid var(--line);border-radius:var(--radius-sm);
    padding:11px 12px;font-size:14px;font-family:inherit;background:var(--sky-bg);color:var(--ink-900);
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--blue-600);}
  .field textarea{resize:vertical;min-height:70px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .checkbox-row{margin-bottom:10px;}

  /* Calendar */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-title{font-weight:800;font-size:15px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
  .cal-dow{font-size:11px;color:var(--ink-400);font-weight:700;padding:4px 0;}
  .cal-cell{
    aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    border-radius:12px;font-size:12.5px;cursor:pointer;position:relative;color:var(--ink-900);
  }
  .cal-cell.pad{visibility:hidden;}
  .cal-cell:hover{background:var(--sky-100);}
  .cal-cell.today{border:2px solid var(--blue-600);font-weight:800;}
  .cal-cell.selected{background:var(--blue-600);color:#fff;}
  .cal-dot{width:5px;height:5px;border-radius:50%;background:var(--yellow-500);margin-top:2px;}
  .cal-cell.selected .cal-dot{background:#fff;}

  .chart-wrap{overflow-x:auto;}
  .stat-row{display:flex;gap:10px;margin-bottom:14px;}
  .stat-box{flex:1;background:var(--sky-100);border-radius:var(--radius-md);padding:12px;text-align:center;}
  .stat-num{font-size:20px;font-weight:800;color:var(--blue-700);}
  .stat-lbl{font-size:11px;color:var(--ink-600);margin-top:2px;}

  .msg-bubble{max-width:78%;padding:10px 13px;border-radius:16px;font-size:13.5px;line-height:1.6;margin-bottom:4px;}
  .msg-row{display:flex;flex-direction:column;margin-bottom:14px;}
  .msg-row.me{align-items:flex-end;}
  .msg-row.them{align-items:flex-start;}
  .msg-row.me .msg-bubble{background:var(--blue-600);color:#fff;border-bottom-right-radius:4px;}
  .msg-row.them .msg-bubble{background:var(--sky-100);border-bottom-left-radius:4px;}
  .msg-meta{font-size:10.5px;color:var(--ink-400);margin-top:3px;padding:0 4px;}
  .msg-thread-title{font-size:12px;color:var(--ink-600);font-weight:700;margin-bottom:12px;}

  .empty-state{text-align:center;padding:36px 16px;color:var(--ink-400);}
  .empty-state .e-icon{font-size:34px;margin-bottom:8px;}
  .empty-state .e-text{font-size:13.5px;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(10,20,35,0.45);z-index:60;display:flex;align-items:flex-end;justify-content:center;}
  @media (min-width:640px){.modal-backdrop{align-items:center;}}
  .modal{
    background:var(--sky-card);width:100%;max-width:460px;max-height:88vh;overflow:auto;
    border-radius:22px 22px 0 0;padding:22px;
  }
  @media (min-width:640px){.modal{border-radius:22px;}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .modal-title{font-weight:800;font-size:16px;}
  .close-btn{width:32px;height:32px;border-radius:50%;border:none;background:var(--sky-100);font-size:16px;cursor:pointer;}

  /* Bottom nav (mobile-first) */
  .bottomnav{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    height:var(--nav-h);
    background:var(--sky-card);
    border-top:1px solid var(--line);
    display:flex;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .nav-item{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    border:none;background:none;cursor:pointer;color:var(--ink-400);font-size:10.5px;font-weight:700;
    padding:6px 2px;
  }
  .nav-item .n-icon{font-size:20px;}
  .nav-item.active{color:var(--blue-600);}

  /* Desktop layout: side nav */
  .desktop-side{display:none;}
  @media (min-width:900px){
    .shell{display:flex;padding-bottom:0;}
    .bottomnav{display:none;}
    .desktop-side{
      display:flex;flex-direction:column;width:230px;flex-shrink:0;
      background:var(--sky-card);border-right:1px solid var(--line);
      min-height:100vh;padding:20px 14px;position:sticky;top:0;align-self:flex-start;
    }
    .ds-nav{margin-top:26px;display:flex;flex-direction:column;gap:4px;flex:1;}
    .ds-item{
      display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;
      border:none;background:none;cursor:pointer;font-size:14px;font-weight:700;color:var(--ink-600);text-align:left;
    }
    .ds-item.active{background:var(--sky-100);color:var(--blue-700);}
    .ds-item:hover{background:var(--sky-100);}
    .ds-icon{font-size:18px;width:22px;text-align:center;}
    .content-col{flex:1;min-width:0;}
    .main{padding:24px 32px 40px;max-width:1000px;}
    .ds-user{font-size:12px;color:var(--ink-400);padding:10px 14px;border-top:1px solid var(--line);margin-top:10px;}
    .ds-logout{font-size:12.5px;font-weight:700;color:var(--ink-600);background:var(--sky-100);border:none;border-radius:10px;padding:9px;cursor:pointer;width:100%;margin-top:8px;}
  }

  .adm-table{width:100%;border-collapse:collapse;font-size:13px;}
  .adm-table th{text-align:left;font-size:11px;color:var(--ink-600);padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap;}
  .adm-table td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  .adm-table-wrap{overflow-x:auto;}
  .adm-actions{display:flex;gap:6px;}
  .toast{
    position:fixed;bottom:calc(var(--nav-h) + 16px);left:50%;transform:translateX(-50%);
    background:var(--ink-900);color:var(--sky-bg);padding:11px 20px;border-radius:30px;font-size:13px;font-weight:700;
    z-index:80;box-shadow:0 6px 18px rgba(0,0,0,0.25);opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
  @media (min-width:900px){.toast{bottom:24px;}}
</style>
</head>

<div id="app"></div>
<div id="toast" class="toast"></div>

<script>

function todayPlus(n){
  const d = new Date();
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}

/* ---------- データ永続化 ---------- */
const LS_KEY = "skyplus_data_v1";
const SESSION_KEY = "skyplus_session_v1";
let DATA = loadData();

function loadData(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ console.error("load error", e); }
  return JSON.parse(JSON.stringify(SEED));
}
function saveData(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(DATA)); }
  catch(e){ console.error("save error", e); }
}
function resetData(){
  DATA = JSON.parse(JSON.stringify(SEED));
  saveData();
  toast("サンプルデータをリセットしました");
  render();
}

/* ---------- セッション ---------- */
function getSession(){
  try{ return JSON.parse(localStorage.getItem(SESSION_KEY)); }catch(e){ return null; }
}
function setSession(role, userId){

}

function currentRole(){
  const s = getSession();
  return s ? s.role : null;

/* ---------- ユーティリティ ---------- */
function fmtDate(iso){
  const d = new Date(iso+"T00:00:00");
  const w = ["日","月","火","水","木","金","土"][d.getDay()];
  return `${d.getMonth()+1}月${d.getDate()}日(${w})`;
}
function fmtDateShort(iso){
  const d = new Date(iso+"T00:00:00");
  return `${d.getMonth()+1}/${d.getDate()}`;
}
function isToday(iso){ return iso === todayPlus(0); }
function daysUntil(iso){
  const a = new Date(todayPlus(0)+"T00:00:00");
  const b = new Date(iso+"T00:00:00");
  return Math.round((b-a)/86400000);
}
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=> el.classList.remove("show"), 2200);
}
function uid(prefix){ return prefix + Math.random().toString(36).slice(2,9); }

function studentIdInScope(){
  const role = currentRole();
  if(role === "student") return currentUser().id;
  if(role === "parent") return currentUser().childId;
  return null;
}

      DATA.homework.filter(h=>h.status==="未提出" && daysUntil(h.due) <= 1).length;

/* ============================================================
   授業予定（カレンダー）
   ============================================================ */
function renderSchedule(){
  const sid = studentIdInScope();
  const base = new Date();
  base.setDate(1);
  base.setMonth(base.getMonth() + STATE.calMonthOffset);
  const y = base.getFullYear(), m = base.getMonth();
  const firstDow = new Date(y,m,1).getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();

  const eventDates = new Set(DATA.schedules.filter(s=>s.studentId===sid).map(s=>s.date));

  let cells = "";
  for(let i=0;i<firstDow;i++) cells += `<div class="cal-cell pad"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cls = ["cal-cell"];
    if(isToday(iso)) cls.push("today");
    if(iso === STATE.calSelected) cls.push("selected");
    cells += `<div class="${cls.join(' ')}" onclick="selectCalDay('${iso}')">${d}${eventDates.has(iso)?'<span class="cal-dot"></span>':''}</div>`;
  }

  const dayEvents = DATA.schedules.filter(s=>s.studentId===sid && s.date===STATE.calSelected).sort((a,b)=>a.start.localeCompare(b.start));
  const upcoming = DATA.schedules.filter(s=>s.studentId===sid && s.date>=todayPlus(0)).sort((a,b)=>a.date.localeCompare(b.date));

  return `
    <div class="card" style="margin-bottom:18px;">
      <div class="cal-head">
        <button class="icon-btn" onclick="STATE.calMonthOffset--;render()">‹</button>
        <div class="cal-title">${y}年 ${m+1}月</div>
        <button class="icon-btn" onclick="STATE.calMonthOffset++;render()">›</button>
      </div>
      <div class="cal-grid">
        ${["日","月","火","水","木","金","土"].map(d=>`<div class="cal-dow">${d}</div>`).join("")}
        ${cells}
      </div>
    </div>

    <div class="section-title">${fmtDate(STATE.calSelected)}の授業</div>
    <div class="card" style="margin-bottom:20px;">
      ${dayEvents.length ? dayEvents.map(s=>`
        <div class="list-row">
          <div class="lr-main">
            <div class="lr-title">${esc(s.subject)}　${s.start}〜${s.end}</div>
            <div class="lr-sub">担当：${esc(s.teacher)}　${s.online?'オンライン授業':'教室：'+esc(s.room)}</div>
          </div>
          <div class="lr-right">
            ${s.online ? `<button class="btn btn-primary btn-sm" onclick="toast('オンライン授業に参加しました（デモ）')">参加する</button>` : `<span class="badge badge-blue">通学</span>`}
          </div>
        </div>`).join("") : `<div class="card-empty">この日の授業予定はありません</div>`}
    </div>

    <div class="section-title">今後の予定</div>
    <div class="card">
      ${upcoming.length ? upcoming.map(s=>`
        <div class="list-row">
          <div class="lr-main">
            <div class="lr-title">${esc(s.subject)}</div>
            <div class="lr-sub">${fmtDate(s.date)}　${s.start}〜${s.end}　${s.online?'オンライン':esc(s.room)}</div>
          </div>
          <div class="lr-right">${isToday(s.date)?'<span class="badge badge-yellow">本日</span>':''}</div>
        </div>`).join("") : `<div class="card-empty">今後の予定はありません</div>`}
    </div>
  `;
}
function selectCalDay(iso){ STATE.calSelected = iso; render(); }

function renderHomework(){
  const sid = studentIdInScope();
  const role = currentRole();
  const readOnly = role === "parent";
  const list = DATA.homework.filter(h=>h.studentId===sid).sort((a,b)=>a.due.localeCompare(b.due));
  const pending = list.filter(h=>h.status==="未提出");
  const done = list.filter(h=>h.status==="提出済み");

  function row(h){
    const dleft = daysUntil(h.due);
    let dueBadge = `<span class="badge badge-gray">${fmtDate(h.due)}</span>`;
    if(h.status==="未提出" && dleft<=1 && dleft>=0) dueBadge = `<span class="badge badge-red">締切間近：${fmtDate(h.due)}</span>`;
    else if(h.status==="未提出" && dleft<0) dueBadge = `<span class="badge badge-red">期限超過：${fmtDate(h.due)}</span>`;
    return `
      <div class="list-row">
        <div class="lr-main">
          <div class="lr-title">${esc(h.subject)}</div>
          <div class="lr-sub">${esc(h.content)}</div>
          <div style="margin-top:6px;">${dueBadge}</div>
        </div>
        <div class="lr-right">
          ${h.status==="提出済み" ? `<span class="badge badge-green">提出済み</span>` :
            (readOnly ? `<span class="badge badge-yellow">未提出</span>` : `<button class="btn btn-primary btn-sm" onclick="submitHomework('${h.id}')">提出する</button>`)}
        </div>
      </div>`;
  }

  return `
    <div class="stat-row">
      <div class="stat-box"><div class="stat-num">${pending.length}</div><div class="stat-lbl">未提出</div></div>
      <div class="stat-box"><div class="stat-num">${done.length}</div><div class="stat-lbl">提出済み</div></div>
    </div>
    <div class="section-title">未提出の宿題</div>
    <div class="card" style="margin-bottom:18px;">
      ${pending.length ? pending.map(row).join("") : `<div class="card-empty">未提出の宿題はありません 🎉</div>`}
    </div>
    <div class="section-title">提出済みの宿題</div>
    <div class="card">
      ${done.length ? done.map(row).join("") : `<div class="card-empty">まだありません</div>`}
    </div>
  `;
}
function submitHomework(id){
  const h = DATA.homework.find(x=>x.id===id);
  if(h){ h.status = "提出済み"; saveData(); toast("宿題を提出しました"); }
  render();
}

/* ============================================================
   学習記録
   ============================================================ */
function renderStudy(){
  const sid = studentIdInScope();
  const role = currentRole();
  const readOnly = role === "parent";
  const logs = DATA.studyLogs.filter(l=>l.studentId===sid).sort((a,b)=>b.date.localeCompare(a.date));

  const days = [];
  for(let i=6;i>=0;i--) days.push(todayPlus(-i));
  const byDay = days.map(d => ({
    date:d,
    minutes: logs.filter(l=>l.date===d).reduce((s,l)=>s+l.minutes,0)
  }));
  const maxMin = Math.max(60, ...byDay.map(d=>d.minutes));
  const totalWeek = byDay.reduce((s,d)=>s+d.minutes,0);

  const barW = 34, gap = 14, chartH = 140;
  const svgW = byDay.length*(barW+gap);
  const bars = byDay.map((d,i)=>{
    const h = Math.round((d.minutes/maxMin) * (chartH-24));
    const x = i*(barW+gap);
    const y = chartH - h;
    const dow = ["日","月","火","水","木","金","土"][new Date(d.date+"T00:00:00").getDay()];
    return `
      <g>
        <rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="8" fill="${isToday(d.date)?'var(--blue-600)':'var(--sky-200)'}"></rect>
        <text x="${x+barW/2}" y="${chartH+16}" text-anchor="middle" font-size="11" fill="var(--ink-600)">${dow}</text>
        ${d.minutes>0 ? `<text x="${x+barW/2}" y="${y-6}" text-anchor="middle" font-size="10" fill="var(--ink-600)">${d.minutes}</text>` : ""}
      </g>`;
  }).join("");

  return `
    <div class="stat-row">
      <div class="stat-box"><div class="stat-num">${totalWeek}</div><div class="stat-lbl">今週の合計（分）</div></div>
      <div class="stat-box"><div class="stat-num">${logs.length}</div><div class="stat-lbl">記録数</div></div>
    </div>

    <div class="section-title">週間学習時間</div>
    <div class="card chart-wrap" style="margin-bottom:20px;">
      <svg width="${svgW}" height="${chartH+30}" viewBox="0 0 ${svgW} ${chartH+30}">
        ${bars}
      </svg>
    </div>

    ${readOnly ? "" : `
    <div class="section-title">学習記録を追加</div>
    <div class="card" style="margin-bottom:20px;">
      <div class="field-row">
        <div class="field"><label>学習日</label><input type="date" id="logDate" value="${todayPlus(0)}"></div>
        <div class="field"><label>教科</label>
          <select id="logSubject">
            <option>数学</option><option>英語</option><option>国語</option><option>理科</option><option>社会</option><option>物理</option><option>その他</option>
          </select>
        </div>
      </div>
      <div class="field"><label>学習時間（分）</label><input type="number" id="logMinutes" min="1" max="600" placeholder="例：40"></div>
      <div class="field"><label>学習内容</label><input type="text" id="logContent" placeholder="例：教科書の問題演習"></div>
      <div class="field"><label>ひとことメモ</label><textarea id="logMemo" placeholder="気づいたことや感想など"></textarea></div>
      <button class="btn btn-primary btn-block" onclick="addStudyLog()">記録する</button>
    </div>`}

    <div class="section-title">記録一覧</div>
    <div class="card">
      ${logs.length ? logs.map(l=>`
        <div class="list-row">
          <div class="lr-main">
            <div class="lr-title">${esc(l.subject)}　${l.minutes}分</div>
            <div class="lr-sub">${fmtDate(l.date)}${l.memo?'　「'+esc(l.memo)+'」':''}</div>
          </div>
        </div>`).join("") : `<div class="card-empty">まだ記録がありません</div>`}
    </div>
  `;
}

        </tbody>
      </table>
    </div>
  `;
}

/* ============================================================
   モーダル（生徒追加）
   ============================================================ */
function openModal(name){ STATE.modal = name; render(); }
function closeModal(){ STATE.modal = null; render(); }
function renderModal(){
  if(STATE.modal === "addStudent"){
    return `
    <div class="modal-backdrop" onclick="closeModal()">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-head"><div class="modal-title">生徒を追加</div><button class="close-btn" onclick="closeModal()">✕</button></div>
        <div class="field"><label>氏名</label><input type="text" id="newStName" placeholder="例：山田 太郎"></div>
        <div class="field"><label>学年</label><input type="text" id="newStGrade" placeholder="例：中学3年"></div>
        <button class="btn btn-primary btn-block" onclick="addStudent()">追加する</button>
      </div>
    </div>`;
  }
  return "";
}
function addStudent(){
  const name = document.getElementById("newStName").value.trim();
  const grade = document.getElementById("newStGrade").value.trim();
  if(!name){ toast("氏名を入力してください"); return; }
  const id = uid("s");
  DATA.users[id] = {id, role:"student", name, grade, avatar:"🌟"};
  saveData();
  STATE.modal = null;
  toast("生徒を追加しました");
  render();
}

/* ============================================================
   ルーター／レンダリング
   ============================================================ */
function renderContent(){
  const role = currentRole();
  const v = STATE.view;
  if(role === "admin"){
    const map = {
      students: renderStudentsAdmin, parents: renderParentsAdmin, teachers: renderTeachersAdmin,
      scheduleAdmin: renderScheduleAdmin, homeworkAdmin: renderHomeworkAdmin, noticesAdmin: renderNoticesAdmin,
      messagesAdmin: renderMessagesAdmin, studyAdmin: renderStudyAdmin
    };
    return (map[v] || renderStudentsAdmin)();
  }
  const map = { home: renderHome, schedule: renderSchedule, homework: renderHomework, study: renderStudy, notices: renderNotices, messages: renderMessages };
  return (map[v] || renderHome)();
}

function render(){
  const app = document.getElementById("app");
  const session = getSession();
  if(!session || !currentUser()){
    app.innerHTML = renderLogin();
    return;
  }
  app.innerHTML = renderShell(renderContent());
}

document.addEventListener("click", (e)=>{
  if(STATE.dropdown && !e.target.closest(".dropdown") && !e.target.closest(".icon-btn")){
    STATE.dropdown = null;
    render();
  }
});

render();
</script>
