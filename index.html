    --blue-050:#EEF4FB; --blue-100:#DCE9F7; --blue-600:#3E7FD1; --blue-700:#2C63AC;
    --green-050:#EAF5EF; --green-500:#4F9E76; --green-700:#397A5B;
    --yellow-050:#FBF3E3; --yellow-500:#DDA22F; --yellow-700:#9C6E14;
    --red-050:#FBECEB; --red-500:#C6564F; --red-700:#9A3D37;
    --ink-900:#28323E; --ink-600:#5B6672; --ink-400:#8B95A1;
    --line:#E3E7EC; --bg:#F6F8FA; --card:#FFFFFF;
    --radius-lg:16px; --radius-md:12px; --radius-sm:8px;
    --header-h:60px; --nav-h:64px; --tabbar-h:48px;
    color-scheme: light;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --blue-050:#152332; --blue-100:#1B2E42; --blue-600:#6FA3E8; --blue-700:#8AB6EE;
      --green-050:#132821; --green-500:#6DBE94; --green-700:#8ED0AA;
      --yellow-050:#2A2213; --yellow-500:#E3B657; --yellow-700:#F0C871;
      --red-050:#2A1918; --red-500:#E07871; --red-700:#EB928C;
      --ink-900:#EAEEF2; --ink-600:#B7C0CA; --ink-400:#828C97;
      --line:#2B3540; --bg:#121820; --card:#1A222B;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --blue-050:#152332; --blue-100:#1B2E42; --blue-600:#6FA3E8; --blue-700:#8AB6EE;
    --green-050:#132821; --green-500:#6DBE94; --green-700:#8ED0AA;
    --yellow-050:#2A2213; --yellow-500:#E3B657; --yellow-700:#F0C871;
    --red-050:#2A1918; --red-500:#E07871; --red-700:#EB928C;
    --ink-900:#EAEEF2; --ink-600:#B7C0CA; --ink-400:#828C97;
    --line:#2B3540; --bg:#121820; --card:#1A222B;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink-900);
    font-family:'Zen Kaku Gothic New','Hiragino Sans',sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  button{font-family:inherit;}
  a{color:inherit;}
  #app{min-height:100vh;}
  .hidden{display:none !important;}
  img{max-width:100%;display:block;}
  input,select,textarea{font-family:inherit;}

  .logo-img{display:block;}
  .brand-row{display:flex;align-items:center;gap:8px;}
  .brand-word{font-weight:900;font-size:19px;letter-spacing:0.2px;color:var(--ink-900);}
  .brand-word .plus{color:var(--blue-600);}

  /* ---------- Login ---------- */
  .login-wrap{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);}
  .login-top{
    background:var(--blue-050);
    padding:52px 20px 34px;
    display:flex;flex-direction:column;align-items:center;
    border-bottom:1px solid var(--line);
    position:relative;overflow:hidden;
  }
  .login-top .star-dot{position:absolute;border-radius:50%;background:var(--yellow-500);opacity:0.55;}
  .login-sub{color:var(--ink-600);font-size:13px;margin:10px 0 0;letter-spacing:0.5px;}
  .login-body{flex:1;display:flex;flex-direction:column;align-items:center;padding:28px 20px 48px;}
  .login-card{width:100%;max-width:380px;}
  .login-title{font-weight:700;font-size:14px;color:var(--ink-600);margin:0 0 14px;}
  .role-btn{
    width:100%;display:flex;align-items:center;gap:14px;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);
    padding:14px 16px;margin-bottom:10px;cursor:pointer;text-align:left;
    transition:border-color .15s ease, background .15s ease;
  }
  .role-btn:hover{border-color:var(--blue-600);background:var(--blue-050);}
  .role-icon{
    width:38px;height:38px;border-radius:10px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;
  }
  .role-name{font-weight:700;font-size:14.5px;}
  .role-desc{font-size:12px;color:var(--ink-600);margin-top:2px;}
  .login-note{font-size:11.5px;color:var(--ink-400);margin-top:20px;line-height:1.8;text-align:center;}
  .login-error{background:#FDECEC;color:#B3261E;font-size:12.5px;font-weight:700;padding:10px 12px;border-radius:8px;margin-bottom:14px;}
  .login-brandline{font-size:11px;color:var(--blue-700);font-weight:700;letter-spacing:1px;margin-top:6px;}

  /* ---------- Shell ---------- */
  .shell{padding-bottom:calc(var(--nav-h) + 14px);min-height:100vh;}
  .topbar{
    position:sticky;top:0;z-index:30;height:var(--header-h);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 14px;background:var(--card);border-bottom:1px solid var(--line);
  }
  .topbar-left{display:flex;align-items:center;gap:9px;min-width:0;}
  .topbar-title{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topbar-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .icon-btn{
    position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
    background:var(--card);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;
  }
  .icon-btn:hover{background:var(--blue-050);}
  .avatar-btn{
    width:38px;height:38px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;color:#fff;cursor:pointer;flex-shrink:0;
  }
  .badge-dot{position:absolute;top:3px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--red-500);border:2px solid var(--card);}

  .dropdown{
    position:absolute;top:calc(var(--header-h) - 2px);right:10px;width:300px;max-width:88vw;
    background:var(--card);border-radius:var(--radius-md);box-shadow:0 8px 22px rgba(20,30,45,0.14);
    border:1px solid var(--line);z-index:40;max-height:70vh;overflow:auto;
  }
  .dropdown-head{padding:11px 14px;font-weight:700;font-size:12.5px;border-bottom:1px solid var(--line);color:var(--ink-600);}
  .dropdown-item{padding:11px 14px;border-bottom:1px solid var(--line);font-size:12.5px;cursor:pointer;}
  .dropdown-item:last-child{border-bottom:none;}
  .dropdown-item:hover{background:var(--blue-050);}
  .dropdown-item .t{font-weight:700;margin-bottom:2px;}
  .dropdown-item .d{color:var(--ink-600);font-size:11.5px;}
  .dropdown-empty{padding:22px 14px;text-align:center;color:var(--ink-400);font-size:12.5px;}

  .tabbar{
    display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:var(--card);
    border-bottom:1px solid var(--line);scrollbar-width:none;position:sticky;top:var(--header-h);z-index:29;
  }
  .tabbar::-webkit-scrollbar{display:none;}
  .tabbar-item{
    flex-shrink:0;padding:8px 13px;border-radius:20px;font-size:12.5px;font-weight:700;
    background:var(--bg);color:var(--ink-600);border:1px solid var(--line);cursor:pointer;white-space:nowrap;
  }
  .tabbar-item.active{background:var(--blue-600);color:#fff;border-color:var(--blue-600);}

  .main{max-width:920px;margin:0 auto;padding:16px 14px 8px;}
  .page-head{margin-bottom:16px;}
  .greeting{font-size:17px;font-weight:900;margin:0 0 2px;}
  .greeting-sub{font-size:12.5px;color:var(--ink-600);margin:0;}
  .section-title{font-size:13.5px;font-weight:700;margin:20px 0 9px;color:var(--ink-900);}
  .section-title:first-child{margin-top:0;}
  .section-head-row{display:flex;align-items:center;justify-content:space-between;margin:20px 0 9px;}
  .section-head-row .section-title{margin:0;}

  .card{background:var(--card);border-radius:var(--radius-md);padding:14px;border:1px solid var(--line);}
  .card-flat{background:var(--card);border-radius:var(--radius-md);border:1px solid var(--line);}

  /* status hero for student/parent home */
  .status-hero{
    border-radius:var(--radius-lg);border:1px solid var(--line);overflow:hidden;margin-bottom:16px;background:var(--card);
  }
  .status-hero-top{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;}
  .status-pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:20px;}
  .status-pill .dot{width:7px;height:7px;border-radius:50%;}
  .status-pill.in{background:var(--green-050);color:var(--green-700);}
  .status-pill.in .dot{background:var(--green-500);}
  .status-pill.out{background:var(--blue-050);color:var(--blue-700);}
  .status-pill.out .dot{background:var(--blue-600);}
  .status-pill.none{background:var(--bg);color:var(--ink-600);}
  .status-pill.none .dot{background:var(--ink-400);}
  .status-pill.absent{background:var(--red-050);color:var(--red-700);}
  .status-pill.absent .dot{background:var(--red-500);}
  .status-hero-grid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);}
  .status-cell{padding:13px 18px;border-right:1px solid var(--line);}
  .status-cell:last-child{border-right:none;}
  .status-cell .lbl{font-size:11px;color:var(--ink-600);margin-bottom:3px;}
  .status-cell .val{font-size:16px;font-weight:900;}
  .status-cell .val small{font-size:11px;font-weight:500;color:var(--ink-600);}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  .list-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);}
  .list-row:last-child{border-bottom:none;}
  .lr-main{min-width:0;}
  .lr-title{font-weight:700;font-size:14px;}
  .lr-sub{font-size:12px;color:var(--ink-600);margin-top:3px;line-height:1.6;}
  .lr-right{flex-shrink:0;text-align:right;}

  .badge{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:5px;}
  .badge-blue{background:var(--blue-050);color:var(--blue-700);}
  .badge-yellow{background:var(--yellow-050);color:var(--yellow-700);}
  .badge-red{background:var(--red-050);color:var(--red-700);}
  .badge-green{background:var(--green-050);color:var(--green-700);}
  .badge-gray{background:var(--bg);color:var(--ink-600);border:1px solid var(--line);}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;
    border-radius:var(--radius-sm);padding:11px 16px;font-weight:700;font-size:13.5px;cursor:pointer;}
  .btn:active{opacity:0.85;}
  .btn-primary{background:var(--blue-600);color:#fff;}
  .btn-primary:hover{background:var(--blue-700);}
  .btn-outline{background:var(--card);border-color:var(--line);color:var(--ink-900);}
  .btn-outline:hover{border-color:var(--blue-600);}
  .btn-sm{padding:7px 12px;font-size:12px;border-radius:7px;}
  .btn-block{width:100%;}
  .btn-danger{background:var(--red-050);color:var(--red-700);border-color:var(--red-050);}
  .btn-ghost{background:transparent;color:var(--ink-600);border-color:transparent;}
  .btn[disabled]{opacity:0.45;cursor:not-allowed;}
  .btn-huge{padding:20px;font-size:16px;border-radius:var(--radius-lg);gap:10px;}

  .stat-strip{display:flex;border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;background:var(--card);margin-bottom:16px;}
  .stat-cell{flex:1;padding:12px 10px;text-align:center;border-right:1px solid var(--line);}
  .stat-cell:last-child{border-right:none;}
  .stat-num{font-size:19px;font-weight:900;}
  .stat-lbl{font-size:10.5px;color:var(--ink-600);margin-top:2px;}

  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--ink-600);margin-bottom:6px;}
  .field input,.field select,.field textarea{
    width:100%;border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 11px;
    font-size:13.5px;background:var(--bg);color:var(--ink-900);font-family:inherit;
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--blue-600);outline-offset:1px;}
  .field textarea{resize:vertical;min-height:64px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .check-row{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:10px;}
  .check-row input{width:auto;}

  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex-shrink:0;padding:8px 14px;border-radius:20px;font-size:12.5px;font-weight:700;
    background:var(--bg);border:1px solid var(--line);color:var(--ink-600);cursor:pointer;white-space:nowrap;}
  .tab.active{background:var(--blue-600);color:#fff;border-color:var(--blue-600);}

  .filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
  .filter-row select, .filter-row input{
    border:1px solid var(--line);border-radius:var(--radius-sm);padding:8px 10px;font-size:12.5px;background:var(--card);color:var(--ink-900);
  }

  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-title{font-weight:700;font-size:14px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;}
  .cal-dow{font-size:10.5px;color:var(--ink-400);font-weight:700;padding:4px 0;}
  .cal-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    border-radius:8px;font-size:12px;cursor:pointer;position:relative;background:var(--bg);}
  .cal-cell.pad{visibility:hidden;}
  .cal-cell.today{border:1.5px solid var(--blue-600);font-weight:700;}
  .cal-cell.att-present{background:var(--green-050);color:var(--green-700);}
  .cal-cell.att-late{background:var(--yellow-050);color:var(--yellow-700);}
  .cal-cell.att-absent{background:var(--red-050);color:var(--red-700);}
  .cal-legend{display:flex;gap:12px;margin-top:10px;font-size:11px;color:var(--ink-600);flex-wrap:wrap;}
  .cal-legend span{display:inline-flex;align-items:center;gap:5px;}
  .cal-legend i{width:9px;height:9px;border-radius:3px;display:inline-block;}

  .adm-table-wrap{overflow-x:auto;}
  .adm-table{width:100%;border-collapse:collapse;font-size:12.5px;}
  .adm-table th{text-align:left;font-size:10.5px;color:var(--ink-600);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:700;}
  .adm-table td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap;}
  .adm-actions{display:flex;gap:6px;}

  .empty-state{text-align:center;padding:30px 14px;color:var(--ink-400);}
  .empty-state .e-text{font-size:13px;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(20,28,38,0.45);z-index:60;display:flex;align-items:flex-end;justify-content:center;}
  @media (min-width:640px){.modal-backdrop{align-items:center;}}
  .modal{background:var(--card);width:100%;max-width:440px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px;}
  @media (min-width:640px){.modal{border-radius:16px;}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .modal-title{font-weight:700;font-size:15px;}
  .close-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:14px;cursor:pointer;}

  /* QR scan screen */
  .scan-wrap{display:flex;flex-direction:column;align-items:center;}
  .scan-frame{
    width:100%;max-width:340px;aspect-ratio:1;border-radius:var(--radius-lg);overflow:hidden;
    background:#111;position:relative;border:1px solid var(--line);
  }
  .scan-frame video{width:100%;height:100%;object-fit:cover;}
  .scan-guide{position:absolute;inset:14%;border:2px solid rgba(255,255,255,0.85);border-radius:16px;pointer-events:none;}
  .scan-status-bar{margin-top:14px;text-align:center;font-size:13px;color:var(--ink-600);min-height:20px;}
  .scan-result{width:100%;max-width:340px;text-align:center;padding:26px 18px;border-radius:var(--radius-lg);border:1px solid var(--line);margin-top:6px;}
  .scan-result.ok{background:var(--green-050);border-color:var(--green-500);}
  .scan-result.err{background:var(--red-050);border-color:var(--red-500);}
  .scan-result .sr-icon{font-size:34px;margin-bottom:8px;}
  .scan-result .sr-title{font-weight:900;font-size:17px;margin-bottom:4px;}
  .scan-result .sr-sub{font-size:12.5px;color:var(--ink-600);}
  .scan-result .sr-time{font-size:26px;font-weight:900;margin:10px 0 2px;}
  .scan-result .sr-name{font-size:15px;font-weight:700;margin:2px 0 6px;}
  .scan-result.identify{background:var(--blue-050);border-color:var(--blue-600);}
  .scan-result .sr-eyebrow{font-size:11.5px;font-weight:700;color:var(--blue-600);letter-spacing:.04em;margin-bottom:6px;}
  .scan-result .sr-name-lg{font-size:21px;font-weight:900;margin-bottom:2px;}
  .scan-result .sr-meta{font-size:12.5px;color:var(--ink-600);margin-bottom:12px;}
  .scan-result .sr-status-row{display:flex;align-items:center;justify-content:center;gap:8px;}
  .scan-hint{font-size:12px;color:var(--ink-600);margin-top:8px;text-align:center;}
  .myqr-wrap{display:flex;flex-direction:column;align-items:center;padding:8px 0 20px;}
  .myqr-card{width:100%;max-width:320px;text-align:center;padding:28px 20px;border-radius:var(--radius-lg);border:1px solid var(--line);background:#fff;}
  .myqr-card .qname{font-weight:900;font-size:17px;margin-top:14px;}
  .settings-block{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-md);padding:16px;margin-bottom:16px;}
  .settings-block-title{font-weight:700;font-size:13px;color:var(--ink-600);margin-bottom:10px;}
  .theme-switch{display:flex;flex-direction:column;gap:8px;}
  .theme-opt{text-align:left;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--line);background:var(--bg);color:var(--ink-900);font-size:14px;font-weight:500;cursor:pointer;}
  .theme-opt.active{border-color:var(--blue-600);background:var(--blue-050);color:var(--blue-700);font-weight:700;}
  .myqr-card .qmeta{font-size:12.5px;color:var(--ink-600);margin-top:2px;}

  .qr-box{display:flex;flex-direction:column;align-items:center;padding:22px;border:1px solid var(--line);border-radius:var(--radius-md);background:#fff;}
  .qr-box .qname{margin-top:12px;font-weight:700;font-size:14px;color:#1c2430;}
  .qr-box .qmeta{font-size:11.5px;color:#6b7480;margin-top:2px;}
  .qr-fallback{font-family:monospace;font-size:12px;padding:12px;background:var(--bg);border-radius:8px;letter-spacing:1px;}

  .msg-bubble{max-width:78%;padding:9px 12px;border-radius:14px;font-size:13px;line-height:1.6;margin-bottom:4px;}
  .msg-row{display:flex;flex-direction:column;margin-bottom:12px;}
  .msg-row.me{align-items:flex-end;}
  .msg-row.them{align-items:flex-start;}
  .msg-row.me .msg-bubble{background:var(--blue-600);color:#fff;border-bottom-right-radius:4px;}
  .msg-row.them .msg-bubble{background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:4px;}
  .msg-meta{font-size:10px;color:var(--ink-400);margin-top:3px;padding:0 4px;}

  .child-chip-row{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;}
  .child-chip{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:8px 13px 8px 8px;border-radius:24px;border:1px solid var(--line);background:var(--card);cursor:pointer;}
  .child-chip.active{border-color:var(--blue-600);background:var(--blue-050);}
  .child-chip .cavatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;}
  .child-chip .cname{font-size:12.5px;font-weight:700;}

  .toast{position:fixed;bottom:calc(var(--nav-h) + 14px);left:50%;transform:translateX(-50%);
    background:var(--ink-900);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:12.5px;font-weight:700;
    z-index:80;box-shadow:0 8px 18px rgba(0,0,0,0.22);opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;max-width:88vw;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
  @media (min-width:900px){.toast{bottom:22px;}}

  /* Bottom nav */
  .bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;height:var(--nav-h);background:var(--card);
    border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);}
  .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    border:none;background:none;cursor:pointer;color:var(--ink-400);font-size:10px;font-weight:700;padding:6px 2px;}
  .nav-item .n-icon{font-size:19px;}
  .nav-item.active{color:var(--blue-600);}
  .nav-item.scan-item .n-icon{
    width:40px;height:40px;border-radius:50%;background:var(--blue-600);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:1px;
  }
  .nav-item.scan-item.active .n-icon{background:var(--blue-700);}

  .desktop-side{display:none;}
  @media (min-width:900px){
    .shell{display:flex;padding-bottom:0;}
    .bottomnav{display:none;}
    .tabbar{display:none;}
    .desktop-side{display:flex;flex-direction:column;width:224px;flex-shrink:0;background:var(--card);
      border-right:1px solid var(--line);min-height:100vh;padding:18px 12px;position:sticky;top:0;align-self:flex-start;}
    .ds-nav{margin-top:22px;display:flex;flex-direction:column;gap:2px;flex:1;}
    .ds-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;border:none;
      background:none;cursor:pointer;font-size:13.5px;font-weight:700;color:var(--ink-600);text-align:left;}
    .ds-item.active{background:var(--blue-050);color:var(--blue-700);}
    .ds-item:hover{background:var(--blue-050);}
    .ds-icon{font-size:16px;width:20px;text-align:center;}
    .content-col{flex:1;min-width:0;}
    .main{padding:22px 30px 40px;max-width:1040px;}
    .ds-user{font-size:11.5px;color:var(--ink-400);padding:10px 12px;border-top:1px solid var(--line);margin-top:8px;}
    .ds-logout{font-size:12px;font-weight:700;color:var(--ink-600);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer;width:100%;margin-top:6px;}
  }
  @media print{
    .topbar,.tabbar,.bottomnav,.desktop-side,.toast{display:none !important;}
    body{background:#fff;}
    .print-only-area{display:block !important;}
  }
</style>

   ============================================================ */
const THEME_KEY = "skyplus_theme_v1";
function getTheme(){
  try{ return localStorage.getItem(THEME_KEY) || "system"; }catch(e){ return "system"; }
}
function applyTheme(mode){
  const root = document.documentElement;
  if(mode==="light") root.setAttribute("data-theme","light");
  else if(mode==="dark") root.setAttribute("data-theme","dark");
  else root.removeAttribute("data-theme"); /* system: OSの設定に追従 */
}
function setTheme(mode){
  try{ localStorage.setItem(THEME_KEY, mode); }catch(e){}
  applyTheme(mode);
  render();
}
function initTheme(){ applyTheme(getTheme()); }
function systemPrefersDark(){
  return typeof window.matchMedia === "function" && window.matchMedia("(prefers-color-scheme: dark)").matches;
}
/* ヘッダーの小さい切替ボタン：タップするたびに ライト→ダーク→端末設定 と巡回 */
function themeToggleHtml(){
  const mode = getTheme();
  const icon = mode==="light" ? "☀️" : mode==="dark" ? "🌙" : "🖥";
  const label = mode==="light" ? "ライトモード" : mode==="dark" ? "ダークモード" : "端末の設定に合わせる";
  return `<button class="icon-btn" title="テーマ：${label}（タップで切替）" onclick="cycleTheme()">${icon}</button>`;
}
function cycleTheme(){
  const order = ["light","dark","system"];
  const next = order[(order.indexOf(getTheme())+1)%order.length];
  setTheme(next);
}
/* 設定／アカウント画面用の、ラベル付きテーマ切り替えブロック */

/* ---------- 権限チェック（データアクセス層） ----------
   画面側の都合に関わらず、常にここを経由して対象生徒IDの
   妥当性を検証する。URLやSTATEの値を書き換えても他人の
   データへはアクセスできない設計。 */
function canAccessStudent(studentId){
  const role = currentRole(); const u = currentUser();
  if(!u || !studentId) return false;
  if(role === "admin") return !!DATA.users[studentId];
  if(role === "student") return u.id === studentId;
  if(role === "parent") return (u.childIds||[]).includes(studentId);
  return false;
}
function assertAccess(studentId){
  if(!canAccessStudent(studentId)){ toast("権限がありません：この情報は閲覧できません"); throw new Error("forbidden"); }
}
function getAttendanceFor(studentId){ assertAccess(studentId); return DATA.attendance.filter(a=>a.studentId===studentId); }
function getScheduleFor(studentId){ assertAccess(studentId); return DATA.schedules.filter(s=>s.studentId===studentId); }
function getHomeworkFor(studentId){ assertAccess(studentId); return DATA.homework.filter(h=>h.studentId===studentId); }
function getStudyLogsFor(studentId){ assertAccess(studentId); return DATA.studyLogs.filter(l=>l.studentId===studentId); }
function getMessagesFor(studentId){ assertAccess(studentId); return DATA.messages.filter(m=>m.studentId===studentId); }
function getAbsenceReportsFor(studentId){ assertAccess(studentId); return DATA.absenceReports.filter(r=>r.studentId===studentId); }
function noticeVisibleTo(notice, role, studentOrNull){
  if(!notice.audience) return true;
  if(!notice.audience.roles.includes(role)) return false;
  if(notice.audience.scope === "all") return true;
  if(notice.audience.scope === "grade") return studentOrNull && studentOrNull.grade === notice.audience.grade;
  if(notice.audience.scope === "students") return studentOrNull && notice.audience.studentIds.includes(studentOrNull.id);
  return true;
}

/* ---------- ユーティリティ ---------- */
function fmtDate(iso){ const d=new Date(iso+"T00:00:00"); const w=["日","月","火","水","木","金","土"][d.getDay()]; return `${d.getMonth()+1}月${d.getDate()}日(${w})`; }
function fmtDateShort(iso){ const d=new Date(iso+"T00:00:00"); return `${d.getMonth()+1}/${d.getDate()}`; }
function isToday(iso){ return iso === todayPlus(0); }
function daysUntil(iso){ const a=new Date(todayPlus(0)+"T00:00:00"); const b=new Date(iso+"T00:00:00"); return Math.round((b-a)/86400000); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(p){ return p + Math.random().toString(36).slice(2,9); }
function toast(msg){
  const el = document.getElementById("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(window.__toastTimer); window.__toastTimer = setTimeout(()=> el.classList.remove("show"), 2400);
}
const AVATAR_PALETTE = ["#3E7FD1","#4F9E76","#DDA22F","#8B6FD1","#4FA0AE"];
function avatarColor(name){ let h=0; for(let i=0;i<String(name).length;i++) h = (h*31 + String(name).charCodeAt(i)) % AVATAR_PALETTE.length; return AVATAR_PALETTE[h]; }
function initials(name){ return String(name||"?").replace(/\s/g,"").slice(0,1); }
function avatarHtml(u, size){
  size = size||38;
  return `<span class="avatar-btn" style="width:${size}px;height:${size}px;font-size:${Math.round(size*0.38)}px;background:${avatarColor(u.name)};">${esc(initials(u.name))}</span>`;
}

function attemptLogin(){
  const idEl = document.getElementById("loginIdInput");
  const pwEl = document.getElementById("loginPwInput");
  const loginId = (idEl ? idEl.value : "").trim().toLowerCase();
  const password = pwEl ? pwEl.value : "";
  if(!loginId || !password){
    STATE.loginError = "ログインIDとパスワードを入力してください。";
    render(); return;
  }
  const user = Object.values(DATA.users).find(u=>(u.loginId||"").toLowerCase()===loginId);
  if(!user || user.password !== password){
    STATE.loginError = "ログインIDまたはパスワードが正しくありません。";
    render(); return;
  }
  STATE.loginError = null;
  doLogin(user.role, user.id);
}
function doLogin(role,userId){
  setSession(role,userId);
  const u = DATA.users[userId];
  if(role==="parent") STATE.activeChildId = (u.childIds||[])[0]||null;
  STATE.view = "home";
  render();
}

  clearSession();
  STATE = {view:"home", adminTab:"attendance-list", settingsTab:"parents", calMonthOffset:0, calSelected:todayPlus(0),

}

/* ============================================================
   出欠ロジック
   ============================================================ */
function attendanceRecordFor(studentId, date){ return DATA.attendance.find(a=>a.studentId===studentId && a.date===date) || null; }
function todaysScheduleFor(studentId){ return DATA.schedules.filter(s=>s.studentId===studentId && s.date===todayPlus(0)).sort((a,b)=>a.start.localeCompare(b.start))[0] || null; }

function studentTodayStatus(studentId){
  const rec = attendanceRecordFor(studentId, todayPlus(0));
  if(!rec) return {state:"none", label:"未入室"};
  if(rec.absent) return {state:"absent", label:"本日欠席"};
  if(rec.checkIn && !rec.checkOut) return {state:"in", label:"在室中"};
  if(rec.checkIn && rec.checkOut) return {state:"out", label:"退室済み"};
  return {state:"none", label:"未入室"};
}

/* QRスキャンによる入退室記録
   ─ 生徒は自分のQRを「表示」し、管理者（先生）がそのQRを「読み取る」方式
   ─ 識別（identify）→ 内容確認 → 確定（confirm）の2段階で記録する */
function identifyStudentByQr(scannedText){
  const role = currentRole();
  if(role !== "admin"){ return {ok:false, code:"role", message:"この操作は管理者アカウントのみ利用できます。"}; }
  if(!scannedText){ return {ok:false, code:"empty", message:"QRコードを認識できませんでした。枠内にコードを写してください。"}; }

  const owner = Object.values(DATA.users).find(u=>u.role==="student" && u.qrCode===scannedText);
  if(!owner){ return {ok:false, code:"invalid", message:"無効なQRコードです。sky+発行の生徒用QRコードを読み取ってください。"}; }
  if(!owner.qrActive){ return {ok:false, code:"disabled", message:"このQRコードは無効化されています。生徒管理から再発行してください。"}; }

  const st = studentTodayStatus(owner.id);
  if(st.state === "out"){ return {ok:false, code:"done", message:"本日の入退室はすでに記録済みです。"}; }
  const action = st.state === "in" ? "out" : "in";
  return {ok:true, recorded:false, studentId:owner.id, action, status:st};
}

/* 確認画面で管理者が記録ボタンを押した時に実際の出欠データへ書き込む */
function confirmAttendance(){
  const r = STATE.scanResult;
  if(!r || !r.ok || r.recorded) return;
  const owner = DATA.users[r.studentId];
  if(!owner) return;
  const date = todayPlus(0);
  let rec = attendanceRecordFor(owner.id, date);
  const t = nowTime();
  const sched = todaysScheduleFor(owner.id);

  if(r.action === "in"){
    let late = false;
    if(sched){
      const [sh,sm] = sched.start.split(":").map(Number);
      const [nh,nm] = t.split(":").map(Number);
      if(nh*60+nm > sh*60+sm+10) late = true;
    }
    if(rec){ rec.checkIn = t; rec.late = late; rec.absent = false; rec.recordedAt = new Date().toISOString(); }
    else{ rec = {id:uid("a"), studentId:owner.id, date, checkIn:t, checkOut:null, late, early:false, recordedAt:new Date().toISOString()}; DATA.attendance.push(rec); }
    saveData();
    STATE.scanResult = {ok:true, recorded:true, studentId:owner.id, action:"in", time:t, late};
  }else{
    let early = false;
    if(sched){
      const [eh,em] = sched.end.split(":").map(Number);
      const [nh,nm] = t.split(":").map(Number);
      if(nh*60+nm < eh*60+em-10) early = true;
    }
    if(rec){ rec.checkOut = t; rec.early = early; rec.recordedAt = new Date().toISOString(); }
    saveData();
    STATE.scanResult = {ok:true, recorded:true, studentId:owner.id, action:"out", time:t, early};
  }
  render();
}

function monthlyStats(studentId, year, month){
  const list = DATA.attendance.filter(a=>a.studentId===studentId).filter(a=>{
    const d = new Date(a.date+"T00:00:00"); return d.getFullYear()===year && d.getMonth()===month;
  });
  let present=0, absent=0, late=0, early=0;
  list.forEach(a=>{ if(a.absent) absent++; else if(a.checkIn){ present++; if(a.late) late++; if(a.early) early++; } });
  return {present,absent,late,early,total:list.length};
}

/* ============================================================
   QRスキャン（カメラ）エンジン
   ============================================================ */
let mediaStream = null, scanRAF = null;
function stopScan(){
  if(scanRAF){ cancelAnimationFrame(scanRAF); scanRAF=null; }
  if(mediaStream){ mediaStream.getTracks().forEach(t=>t.stop()); mediaStream=null; }
}
function setScanStatus(msg){
  STATE.scanMessage = msg;
  const el = document.getElementById("scanStatusText");
  if(el) el.textContent = msg;
}
async function startScan(){
  if(STATE.view !== "scan") return;
  const video = document.getElementById("scanVideo");
  if(!video) return;
  setScanStatus("カメラを起動しています…");
  try{
    mediaStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    video.srcObject = mediaStream;
    await video.play();
    setScanStatus("QRコードを枠内に写してください");
    const canvas = document.getElementById("scanCanvas");
    const ctx = canvas.getContext("2d", {willReadFrequently:true});
    const loop = ()=>{
      if(STATE.view !== "scan" || !mediaStream) return;
      if(video.readyState === video.HAVE_ENOUGH_DATA && typeof jsQR === "function"){
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        ctx.drawImage(video,0,0,canvas.width,canvas.height);
        try{
          const img = ctx.getImageData(0,0,canvas.width,canvas.height);
          const code = jsQR(img.data, img.width, img.height);
          if(code && code.data){ onScanDecoded(code.data); return; }
        }catch(e){ /* デコード失敗時は次フレームへ */ }
      }
      scanRAF = requestAnimationFrame(loop);
    };
    scanRAF = requestAnimationFrame(loop);
  }catch(e){
    setScanStatus("カメラを使用できませんでした。下のボタンからテストできます。");
  }
}
function onScanDecoded(text){
  stopScan();
  finishScan(text);
}
function finishScan(text){
  const result = identifyStudentByQr(text);
  STATE.scanResult = result;
  STATE.view = "scan";
  render();
}
function simulateScan(){
  const sample = Object.values(DATA.users).find(u=>u.role==="student" && u.qrActive);
  if(sample) finishScan(sample.qrCode);
}
function rescan(){ STATE.scanResult=null; render(); setTimeout(startScan,60); }

  const sid = STATE.activeChildId;
  assertAccess(sid);
  const date = document.getElementById("abDate").value;

  const note = document.getElementById("abNote").value.trim();

  DATA.absenceReports.push({id:uid("ab"), studentId:sid, date, reason, note, reportedBy:currentUser().id, createdAt:new Date().toISOString(), acknowledged:false});

    if(!rec){ rec = {id:uid("a"), studentId:sid, date, checkIn:null, checkOut:null, late:false, early:false, recordedAt:new Date().toISOString()}; DATA.attendance.push(rec); }

  toast("連絡を送信しました");
  render();
}

function renderAttendanceAdmin(){
  const f = STATE.attFilter;
  const students = Object.values(DATA.users).filter(u=>u.role==="student");
  const grades = [...new Set(students.map(s=>s.grade))];
  let rows = DATA.attendance.map(a=>({...a, student: DATA.users[a.studentId]})).filter(r=>r.student);
  if(f.date) rows = rows.filter(r=>r.date===f.date);
  if(f.name) rows = rows.filter(r=>r.student.name.includes(f.name));
  if(f.grade) rows = rows.filter(r=>r.student.grade===f.grade);
  if(f.status){
    rows = rows.filter(r=>{
      if(f.status==="出席") return r.checkIn && !r.absent;
      if(f.status==="欠席") return r.absent;
      if(f.status==="遅刻") return r.late;
      if(f.status==="早退") return r.early;
      return true;
    });
  }
  rows.sort((a,b)=> b.date.localeCompare(a.date));

  return `
    <div class="filter-row">

      <select onchange="STATE.attFilter.grade=this.value;render()">
        <option value="">学年（すべて）</option>
        ${grades.map(g=>`<option value="${esc(g)}" ${f.grade===g?'selected':''}>${esc(g)}</option>`).join("")}
      </select>
      <select onchange="STATE.attFilter.status=this.value;render()">
        <option value="">状態（すべて）</option>
        <option ${f.status==='出席'?'selected':''}>出席</option>
        <option ${f.status==='遅刻'?'selected':''}>遅刻</option>
        <option ${f.status==='早退'?'selected':''}>早退</option>
        <option ${f.status==='欠席'?'selected':''}>欠席</option>
      </select>
      <button class="btn btn-outline btn-sm" onclick="STATE.attFilter={date:'',name:'',grade:'',status:''};render()">条件をクリア</button>
      <button class="btn btn-outline btn-sm" onclick="exportAttendanceCsv()">CSV出力</button>
    </div>
    <div class="card-flat adm-table-wrap">
      <table class="adm-table">
        <thead><tr><th>生徒名</th><th>学年</th><th>日付</th><th>入室</th><th>退室</th><th>状態</th></tr></thead>
        <tbody>
          ${rows.map(r=>`<tr>
            <td>${esc(r.student.name)}</td><td>${esc(r.student.grade)}</td><td>${fmtDateShort(r.date)}</td>
            <td>${r.checkIn||"―"}</td><td>${r.checkOut||"―"}</td>
            <td>${r.absent?'<span class="badge badge-red">欠席</span>':r.late?'<span class="badge badge-yellow">遅刻</span>':r.early?'<span class="badge badge-yellow">早退</span>':r.checkIn?'<span class="badge badge-green">出席</span>':'<span class="badge badge-gray">未記録</span>'}</td>
          </tr>`).join("")}
        </tbody>
      </table>
      ${rows.length===0? `<div class="empty-state"><div class="e-text">条件に一致するデータがありません</div></div>` : ""}
    </div>
  `;
}
async function exportAttendanceCsv(){
  const f = STATE.attFilter;
  let rows = DATA.attendance.map(a=>({...a, student: DATA.users[a.studentId]})).filter(r=>r.student);
  if(f.date) rows = rows.filter(r=>r.date===f.date);
  if(f.name) rows = rows.filter(r=>r.student.name.includes(f.name));
  if(f.grade) rows = rows.filter(r=>r.student.grade===f.grade);
  const header = "生徒名,学年,日付,入室時刻,退室時刻,状態\n";
  const csv = header + rows.map(r=>{
    const status = r.absent?"欠席":r.late?"遅刻":r.early?"早退":r.checkIn?"出席":"未記録";
    return [r.student.name, r.student.grade, r.date, r.checkIn||"", r.checkOut||"", status].join(",");
  }).join("\n");
  try{
    if(window.claude && typeof window.claude.use === "function"){
      const downloads = await window.claude.use("downloads");
      if(downloads){ await downloads.save({filename:"attendance.csv", data:csv}); toast("CSVを出力しました"); return; }
    }
    toast("この環境ではダウンロードを利用できません");
  }catch(e){ toast("CSV出力でエラーが発生しました"); }
}

/* ============================================================
   管理者：お知らせ管理
   ============================================================ */
function renderNoticesAdmin(){
  const rows = [...DATA.notices].sort((a,b)=>b.date.localeCompare(a.date));
  const grades = [...new Set(Object.values(DATA.users).filter(u=>u.role==="student").map(s=>s.grade))];
  const students = Object.values(DATA.users).filter(u=>u.role==="student");
  return `
    <div class="section-title">お知らせを作成</div>
    <div class="card" style="margin-bottom:18px;">
      <div class="field"><label>タイトル</label><input type="text" id="ntTitle"></div>
      <div class="field"><label>本文</label><textarea id="ntBody"></textarea></div>
      <div class="field-row">
        <div class="field"><label>表示対象</label>
          <select id="ntRoles"><option value="both">生徒・保護者の両方</option><option value="student">生徒のみ</option><option value="parent">保護者のみ</option></select>
        </div>
        <div class="field"><label>範囲</label>
          <select id="ntScope" onchange="toggleNoticeScope(this.value)">
            <option value="all">全員</option><option value="grade">特定の学年</option><option value="students">特定の生徒</option>
          </select>
        </div>
      </div>
      <div class="field hidden" id="ntGradeField"><label>対象学年</label>
        <select id="ntGrade">${grades.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join("")}</select>
      </div>
      <div class="field hidden" id="ntStudentsField"><label>対象生徒（複数選択可）</label>
        <select id="ntStudents" multiple size="4">${students.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select>
      </div>
      <div class="field"><label>重要度</label><label class="check-row"><input type="checkbox" id="ntImportant">重要なお知らせとして表示する</label></div>
      <button class="btn btn-primary btn-block" onclick="addNotice()">配信する</button>
    </div>
    <div class="section-title">配信済みのお知らせ</div>
    <div class="card-flat" style="padding:0 14px;">
      ${rows.map(n=>`<div class="list-row"><div class="lr-main">
        <div class="lr-title">${n.important?'<span class="badge badge-red">重要</span> ':''}${esc(n.title)}</div>
        <div class="lr-sub">${esc(n.body)}</div>
        <div class="lr-sub" style="color:var(--ink-400);">${fmtDate(n.date)}　対象：${noticeAudienceLabel(n)}</div>
      </div><div class="lr-right"><button class="btn btn-danger btn-sm" onclick="deleteNotice('${n.id}')">削除</button></div></div>`).join("")}
    </div>
  `;
}
function toggleNoticeScope(scope){
  const gf = document.getElementById("ntGradeField"), sf = document.getElementById("ntStudentsField");
  if(gf) gf.classList.toggle("hidden", scope!=="grade");
  if(sf) sf.classList.toggle("hidden", scope!=="students");
}
function noticeAudienceLabel(n){
  const a=n.audience; const roleLabel = {both:"生徒・保護者",student:"生徒",parent:"保護者"}[a.roles.length===2?"both":a.roles[0]]||"全員";
  if(a.scope==="all") return roleLabel+"全員";
  if(a.scope==="grade") return roleLabel+"（"+a.grade+"）";
  return roleLabel+"（特定の生徒）";
}
function addNotice(){
  const title=document.getElementById("ntTitle").value.trim(), body=document.getElementById("ntBody").value.trim();
  const rolesSel=document.getElementById("ntRoles").value, scope=document.getElementById("ntScope").value;
  const important=document.getElementById("ntImportant").checked;
  if(!title||!body){ toast("タイトルと本文を入力してください"); return; }
  const roles = rolesSel==="both" ? ["student","parent"] : [rolesSel];
  const audience = {roles, scope};
  if(scope==="grade"){ const g=document.getElementById("ntGrade"); audience.grade = g? g.value : ""; }
  if(scope==="students"){ const sel=document.getElementById("ntStudents"); audience.studentIds = sel? Array.from(sel.selectedOptions).map(o=>o.value) : []; }
  DATA.notices.unshift({id:uid("n"), title, body, date:todayPlus(0), important, audience});
  Object.values(DATA.users).filter(u=>u.role==="student"||u.role==="parent").forEach(u=>addNotification(u.id,"notice",`「${title}」が届きました`));
  saveData(); toast("お知らせを配信しました"); render();
}
function deleteNotice(id){ DATA.notices = DATA.notices.filter(n=>n.id!==id); saveData(); toast("削除しました"); render(); }

/* ============================================================
   管理者：カレンダー（出欠集計）― 設定タブから呼び出し
   ============================================================ */
function renderCalendarAdmin(){
  const students = Object.values(DATA.users).filter(u=>u.role==="student");
  if(!STATE.calStudent) STATE.calStudent = students[0]?.id;
  const sid = STATE.calStudent;
  const base = new Date(); base.setDate(1); base.setMonth(base.getMonth()+STATE.calMonthOffset);
  const y=base.getFullYear(), m=base.getMonth();
  const firstDow = new Date(y,m,1).getDay(); const daysInMonth = new Date(y,m+1,0).getDate();
  const records = {}; DATA.attendance.filter(a=>a.studentId===sid).forEach(a=>records[a.date]=a);
  let cells = "";
  for(let i=0;i<firstDow;i++) cells += `<div class="cal-cell pad"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const rec = records[iso];
    let cls="cal-cell"; if(isToday(iso)) cls+=" today";
    if(rec){ if(rec.absent) cls+=" att-absent"; else if(rec.late||rec.early) cls+=" att-late"; else if(rec.checkIn) cls+=" att-present"; }
    cells += `<div class="${cls}">${d}</div>`;
  }
  const m2 = monthlyStats(sid, y, m);
  return `
    <div class="field"><label>生徒を選択</label><select onchange="STATE.calStudent=this.value;render()">${students.map(s=>`<option value="${s.id}" ${sid===s.id?'selected':''}>${esc(s.name)}</option>`).join("")}</select></div>
    <div class="card" style="margin-bottom:14px;">
      <div class="cal-head">
        <button class="icon-btn" onclick="STATE.calMonthOffset--;render()">‹</button>
        <div class="cal-title">${y}年 ${m+1}月</div>
        <button class="icon-btn" onclick="STATE.calMonthOffset++;render()">›</button>
      </div>
      <div class="cal-grid">${["日","月","火","水","木","金","土"].map(d=>`<div class="cal-dow">${d}</div>`).join("")}${cells}</div>
      <div class="cal-legend">
        <span><i style="background:var(--green-050);"></i>出席</span>
        <span><i style="background:var(--yellow-050);"></i>遅刻・早退</span>
        <span><i style="background:var(--red-050);"></i>欠席</span>
      </div>
    </div>
    <div class="stat-strip">
      <div class="stat-cell"><div class="stat-num">${m2.present}</div><div class="stat-lbl">出席</div></div>
      <div class="stat-cell"><div class="stat-num">${m2.late}</div><div class="stat-lbl">遅刻</div></div>
      <div class="stat-cell"><div class="stat-num">${m2.early}</div><div class="stat-lbl">早退</div></div>
      <div class="stat-cell"><div class="stat-num">${m2.absent}</div><div class="stat-lbl">欠席</div></div>
    </div>
  `;
}

/* ============================================================
   モーダル
   ============================================================ */
function openModal(name, ctx){ STATE.modal = name; STATE.modalCtx = ctx||null; render(); if(name==="viewQr"||name==="myQr") setTimeout(()=>renderQrInto(name,ctx),60); }
function closeModal(){ STATE.modal = null; STATE.modalCtx = null; render(); }

function renderQrInto(name, ctx){
  const s = name==="myQr" ? currentUser() : DATA.users[ctx];
  const el = document.getElementById("qrTarget");
  if(!el || !s) return;
  el.innerHTML = "";
  if(typeof QRCode === "function"){
    try{ new QRCode(el, {text:s.qrCode, width:172, height:172, colorDark:"#28323E", colorLight:"#ffffff"}); return; }catch(e){}
  }
  el.innerHTML = `<div class="qr-fallback">${esc(s.qrCode)}</div>`;
}

function renderModal(){
  if(STATE.modal === "studentForm"){
    const id = STATE.modalCtx;
    const s = id ? DATA.users[id] : null;
    const parents = Object.values(DATA.users).filter(u=>u.role==="parent");
    return `<div class="modal-backdrop" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()">
      <div class="modal-head"><div class="modal-title">${s?"生徒を編集":"生徒を追加"}</div><button class="close-btn" onclick="closeModal()">✕</button></div>
      <div class="field-row"><div class="field"><label>氏名</label><input type="text" id="stName" value="${s?esc(s.name):''}"></div><div class="field"><label>ふりがな</label><input type="text" id="stKana" value="${s?esc(s.kana||''):''}"></div></div>
      <div class="field-row"><div class="field"><label>学年</label><input type="text" id="stGrade" value="${s?esc(s.grade||''):''}" placeholder="例：中学2年"></div><div class="field"><label>クラス</label><input type="text" id="stCls" value="${s?esc(s.cls||''):''}" placeholder="例：Aクラス"></div></div>
      <div class="field-row"><div class="field"><label>生徒番号</label><input type="text" id="stNo" value="${s?esc(s.studentNo||''):''}"></div><div class="field"><label>在籍状況</label><select id="stStatus"><option ${s&&s.status==='在籍'?'selected':''}>在籍</option><option ${s&&s.status==='休会'?'selected':''}>休会</option><option ${s&&s.status==='退会'?'selected':''}>退会</option></select></div></div>
      <div class="field"><label>保護者</label><select id="stParent"><option value="">未設定</option>${parents.map(p=>`<option value="${p.id}" ${s&&(s.parentIds||[]).includes(p.id)?'selected':''}>${esc(p.name)}</option>`).join("")}</select></div>
      <button class="btn btn-primary btn-block" onclick="saveStudentForm(${s?`'${s.id}'`:'null'})">${s?"更新する":"追加する"}</button>
    </div></div>`;
  }
  if(STATE.modal === "viewQr" || STATE.modal === "myQr"){
    const s = STATE.modal==="myQr" ? currentUser() : DATA.users[STATE.modalCtx];
    return `<div class="modal-backdrop" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()">
      <div class="modal-head"><div class="modal-title">QRコード</div><button class="close-btn" onclick="closeModal()">✕</button></div>
      <div class="qr-box"><div id="qrTarget"></div><div class="qname">${esc(s.name)}</div><div class="qmeta">${esc(s.studentNo||'')}　${s.qrActive?'有効':'無効'}</div></div>
      <button class="btn btn-primary btn-block" style="margin-top:14px;" onclick="window.print()">印刷する</button>
    </div></div>`;
  }
  return "";
}
function saveStudentForm(id){
  const name=document.getElementById("stName").value.trim(), kana=document.getElementById("stKana").value.trim(),
    grade=document.getElementById("stGrade").value.trim(), cls=document.getElementById("stCls").value.trim(),
    studentNo=document.getElementById("stNo").value.trim(), status=document.getElementById("stStatus").value,
    parentId=document.getElementById("stParent").value;
  if(!name){ toast("氏名を入力してください"); return; }
  let targetId = id;
  if(id){
    const s = DATA.users[id];
    Object.assign(s, {name,kana,grade,cls,studentNo,status,parentIds: parentId?[parentId]:[]});
  }else{
    targetId = uid("s");
    DATA.users[targetId] = {id:targetId, role:"student", name, kana, grade, cls, studentNo, status,
      parentIds: parentId?[parentId]:[], qrCode:"SKY-STU-"+(studentNo||targetId).replace(/\D/g,"")+"-"+Math.random().toString(36).slice(2,6).toUpperCase(), qrActive:true};
  }
  // 保護者側の childIds を同期（他の保護者からは解除、選択した保護者へ紐付け）
  Object.values(DATA.users).filter(u=>u.role==="parent").forEach(p=>{
    p.childIds = (p.childIds||[]).filter(cid=>cid!==targetId);
  });
  if(parentId){ const p=DATA.users[parentId]; if(p){ p.childIds = p.childIds||[]; if(!p.childIds.includes(targetId)) p.childIds.push(targetId); } }
  saveData(); STATE.modal=null; toast(id?"生徒情報を更新しました":"生徒を追加しました"); render();
}

/* ============================================================
   ルーター
   ============================================================ */
function renderContent(){
  const role = currentRole(); const v = STATE.view;
  if(v==="account") return renderAccount();
  if(v==="homeworkView") return renderHomeworkView();
  if(v==="studyView") return renderStudyView();
  if(v==="messagesView") return renderMessagesView();
  if(role==="admin"){
    const map = {home:renderAdminHome, scan:renderScan, attendance:renderAttendanceAdmin, students:renderStudentsAdmin, qr:renderQrAdmin, scheduleAdmin:renderScheduleAdmin, noticesAdmin:renderNoticesAdmin, settings:renderSettings};
    return (map[v]||renderAdminHome)();
  }
  const map = {home:renderStudentOrParentHome, myqr:renderMyQR, history:renderHistory, schedule:renderScheduleView, notices:renderNoticesView, children:renderChildren, absence:renderAbsence};
  return (map[v]||renderStudentOrParentHome)();
}
function render(){
  const app = document.getElementById("app");
  const session = getSession();
  if(!session || !currentUser()){ app.innerHTML = renderLogin(); return; }
  app.innerHTML = renderShell(renderContent());
}
document.addEventListener("click",(e)=>{
  if(STATE.dropdown && !e.target.closest(".dropdown") && !e.target.closest(".icon-btn")){ STATE.dropdown=null; render(); }
});
initTheme();
render();
</script>
